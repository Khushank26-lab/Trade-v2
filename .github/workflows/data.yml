name: Update Market Data

on:
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Get repository code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Run Data Downloader
        env:
          PYTHONPATH: .
        run: |
          # The fix is here: using -m app.worker instead of app/worker.py
          python -m app.worker

      - name: 💾 Save Data back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-updated market data [skip ci]"
          git push
