name: Update Market Data

on:
  schedule:
    # This runs automatically at 6:00 PM IST (12:30 UTC), Monday through Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # This adds a manual "Run" button for you

permissions:
  contents: write

jobs:
  download-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # Gives it up to 2 hours to download everything

    steps:
      - name: 📥 Get repository code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Run Data Downloader
        run: |
          # This runs your worker script to download the data
          python app/worker.py

      - name: 💾 Save Data back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-updated market data [skip ci]" || echo "No new data to commit"
          git push
